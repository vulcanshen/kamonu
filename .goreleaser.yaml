version: 2

project_name: kamonu

builds:
  - main: .
    binary: kamonu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # `kamonu version` and the splash print it with its v (tdp S5).
      - -s -w -X main.version=v{{.Version}}
    goos:
      # unix-first, like the rest of the u-family: no windows target.
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

# A formula, not a cask, like the rest of the u-family: a formula binary is
# never stamped com.apple.quarantine, so an unsigned binary runs clean.
#
# No dependencies: a single static binary.
brews:
  - repository:
      owner: vulcanshen
      name: homebrew-tap
      # GITHUB_TOKEN for the release and the tap, as in the family: a
      # release run by hand takes the shell's; the workflow hands it a PAT
      # when one is set, since the built-in token cannot write to the tap.
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://github.com/vulcanshen/kamonu"
    description: "Draw the mark of a terminu family app, letter by letter, in the terminal (u-family)"
    caveats: |
      `kamonu` lists your marks and draws them a cell at a time, each letter
      in a colour of its own; Ex[P]ort writes the svg an app keeps as
      docs/icon.svg. Marks are kept in ~/.kamonu/data.

      A Nerd Font terminal profile is required: the cells are Nerd Font
      glyphs. macOS and Linux (WSL too); Windows is not supported.
    test: |
      system "#{bin}/kamonu", "version"
